services:
  db:
    image: postgres:16-alpine
    container_name: asiatek-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asiastore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - asiatek-pos-db-data:/var/lib/postgresql/data

volumes:
  asiatek-pos-db-data:
